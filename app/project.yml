name: Stone
options:
  bundleIdPrefix: net.imput
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    STONE_CORE_OUT: "$(HOME)/chromium/src/out/Core"
    STONE_CORE_FRAMEWORK: "Chromium Framework"
  configs:
    Release:
      STONE_CORE_OUT: "$(HOME)/chromium/src/out/Release"

targets:
  Stone:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/AppIcon.icon
      - path: Resources/Fonts
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: Stone
        CFBundleDisplayName: Stone
        CFBundleShortVersionString: "0.4.0"
        CFBundleVersion: "19"
        NSPrincipalClass: BrowserCrApplication
        LSMinimumSystemVersion: "13.0"
        NSSupportsAutomaticGraphicsSwitching: true
        NSHighResolutionCapable: true
        NSBluetoothAlwaysUsageDescription: "Once Stone has access, websites will be able to ask you for access."
        NSBluetoothPeripheralUsageDescription: "Once Stone has access, websites will be able to ask you for access."
        NSCameraUsageDescription: "Once Stone has access, websites will be able to ask you for access."
        NSMicrophoneUsageDescription: "Once Stone has access, websites will be able to ask you for access."
        NSLocationUsageDescription: "Once Stone has access, websites will be able to ask you for access."
        NSLocationWhenInUseUsageDescription: "Once Stone has access, websites will be able to ask you for access."
        NSAudioCaptureUsageDescription: "Once Stone has access, websites will be able to ask you for access."
        NSContactsUsageDescription: "Once Stone has access, websites will be able to ask you for access."
        NSLocalNetworkUsageDescription: "Once Stone has access, websites will be able to ask you for access."
        NSScreenCaptureUsageDescription: "Once Stone has access, websites will be able to ask you for access."
        CFBundleURLTypes:
          - CFBundleURLName: Web site URL
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [http, https]
        CFBundleDocumentTypes:
          - CFBundleTypeName: HTML document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes: [public.html, public.xhtml]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.stone.browser
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Stone-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(SRCROOT)/../core/public"
        FRAMEWORK_SEARCH_PATHS: "$(STONE_CORE_OUT)"
        OTHER_LDFLAGS: "-framework \"$(STONE_CORE_FRAMEWORK)\""
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks $(STONE_CORE_OUT)"
        ENABLE_HARDENED_RUNTIME: false
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: Z7JCWW3N99
    postBuildScripts:
      - name: Embed StoneCore
        script: "\"$SRCROOT/scripts/embed_core.sh\""
        basedOnDependencyAnalysis: false
